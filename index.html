  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <!-- Bản thử: xin máy tìm kiếm đừng hiện trang này. Nội dung thẩm định xong thì xóa dòng dưới. -->
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#fbf6e9">

  <title>Niệm Phật Đường</title>
  <!-- Biểu tượng thật sẽ thêm ở Giai đoạn E. -->
  <link rel="icon" href="data:,">

<body>
  <!-- js/app.js dựng toàn bộ giao diện vào đây. Dòng chữ bên trong chỉ hiện
       nếu sau 3 giây app vẫn chưa chạy (ví dụ mở thẳng file bằng cách bấm đúp). -->
  <div id="app">
    <!-- Khung trống, cao bằng thanh trên và thanh dưới thật, để lúc app hiện ra không bị nhảy. -->
    <div class="app-header"><div class="app-header-inner"></div></div>
    <div class="app-main">
      <p class="boot-message">Đang mở app… Nếu màn hình này không đổi, xin xem cách chạy trong file README.md.</p>
    </div>
    <div class="app-nav" aria-hidden="true"><span class="nav-item nav-blank"><span class="icon"></span><span class="nav-label">Niệm Phật</span></span></div>
